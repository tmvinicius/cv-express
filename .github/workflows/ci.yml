# ==============================================================================
#  CI — o mesmo portão que se roda antes de entregar, a cada push e PR.
#
#  O `main` chegou a ficar quebrado duas vezes sem ninguém perceber: o
#  typecheck falhando, e a página do link do e-mail no diretório errado (o
#  build quebrava e todo link enviado daria 404). Os dois seriam pegos aqui.
#
#  Quatro jobs em paralelo, porque falham por motivos diferentes:
#    - verificar: build, tipos, lint, testes e o `next build` (verificar:completo);
#    - e2e: um navegador percorrendo o produto contra Postgres, worker e app;
#    - vercel: o build do app num clone sem `dist/`, com o comando do vercel.json;
#    - imagem: a imagem Docker do worker, compilando currículos com o Tectonic
#      de verdade, dentro da sandbox do docker-compose.
#
#  Não há segredo nenhum aqui. A IA roda no modo mock, o e-mail no console e,
#  no e2e, o Tectonic é o falso de e2e/: nada pago, nada que dependa de chave.
# ==============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Só leitura: este workflow não comenta, não publica e não faz push.
permissions:
  contents: read

# Um push novo no mesmo PR cancela a execução anterior, que já não diz nada.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: build, tipos, lint e testes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # A versão do pnpm vem do `packageManager` do package.json — a mesma de
      # quem desenvolve. O `pnpm/setup`, sucessor desta action, exige pnpm 11.
      - uses: pnpm/action-setup@v6
        with:
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # --frozen-lockfile: um package.json que mudou sem o lockfile acompanhar
      # falha aqui, e não na implantação.
      - run: pnpm install --frozen-lockfile

      - run: pnpm run verificar:completo

  e2e:
    name: ponta a ponta (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cvexpress
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: cvexpress
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cvexpress -d cvexpress"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20

    env:
      # As migrações são aplicadas pelo próprio E2E ao subir o app.
      DATABASE_URL: postgres://cvexpress:ci@localhost:5432/cvexpress

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - run: pnpm install --frozen-lockfile

      # O E2E roda contra o build de PRODUÇÃO do app e o `dist/` do worker.
      - run: pnpm run build && pnpm run build:apps

      # O Chromium da mesma versão do @playwright/test, com as bibliotecas do
      # sistema que ele precisa.
      - run: pnpm --filter @cv-express/e2e exec playwright install --with-deps chromium

      - run: pnpm run e2e

      # Na falha: relatório, trace, capturas de tela e o log do app — que é
      # onde está o motivo quando o problema é do servidor.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-resultados
          path: e2e/resultados/
          retention-days: 7

  vercel:
    name: build como na Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - run: pnpm install --frozen-lockfile

      # Nenhum `pnpm run build` antes: a Vercel recebe o repositório sem
      # `dist/`, e o `verificar` acima não pega isso porque constrói os
      # pacotes primeiro. Sem a primeira metade do comando, o `next build`
      # falha ao carregar o next.config.ts. O comando é LIDO do vercel.json,
      # para que este job teste o que a Vercel roda, e não uma cópia.
      - name: buildCommand do vercel.json
        working-directory: apps/web
        run: sh -c "$(node -p 'require("./vercel.json").buildCommand')"

  imagem:
    name: imagem do worker (Docker e Tectonic de verdade)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # A fumaça importa os fixtures e o contrato do `dist/` dos pacotes.
      - run: pnpm install --frozen-lockfile && pnpm run build

      # O mesmo docker-compose de quem desenvolve: a imagem do Dockerfile e a
      # sandbox (disco só de leitura, sem capabilities, limites de memória e
      # de processos). O build da imagem já compila um documento de teste; o
      # --wait espera o healthcheck do compose.
      - run: docker compose up -d --build --wait latex-worker

      # Acentos, escape, âncoras do .aux, cache e o currículo hostil, num
      # Tectonic de verdade com o cache embutido e sem baixar nada.
      - run: pnpm --filter @cv-express/e2e imagem
        env:
          WORKER_URL: http://localhost:8080
          WORKER_TOKEN: token-local-nao-use-em-producao

      # O log do LaTeX nunca vai ao cliente; quando uma compilação falha, o
      # motivo está aqui, indexado pelo requestId que a fumaça imprime.
      - name: log do worker
        if: always()
        run: docker compose logs latex-worker
